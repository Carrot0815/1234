<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO // 分享交流平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #08080f;
  --bg-card: #0f0f1a;
  --bg-hover: #161624;
  --bg-input: #12121e;
  --border: rgba(120,100,200,0.15);
  --border-glow: rgba(160,120,255,0.35);
  --accent: #a374ff;
  --accent2: #ff6b9d;
  --accent3: #5ee7df;
  --text-primary: #e8e0ff;
  --text-secondary: #8a80aa;
  --text-muted: #4a4468;
  --glass: rgba(255,255,255,0.03);
  --shadow-glow: 0 0 40px rgba(163,116,255,0.12);
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Noise texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

/* Ambient background blobs */
.ambient {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  z-index: 0;
}
.ambient-1 {
  width: 500px; height: 500px;
  background: rgba(163,116,255,0.06);
  top: -100px; left: -100px;
}
.ambient-2 {
  width: 400px; height: 400px;
  background: rgba(255,107,157,0.05);
  bottom: -50px; right: -50px;
}
.ambient-3 {
  width: 300px; height: 300px;
  background: rgba(94,231,223,0.04);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
}

/* ===== NAVBAR ===== */
#navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(8,8,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
#navbar.show { display: flex; }

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.3rem;
  letter-spacing: 0.08em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.85rem;
  padding: 7px 16px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.nav-btn:hover, .nav-btn.active {
  color: var(--text-primary);
  border-color: var(--border-glow);
  background: var(--glass);
}

.nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
}
.nav-nickname {
  font-size: 0.85rem;
  color: var(--text-secondary);
}
.nav-logout {
  background: none;
  border: 1px solid rgba(255,107,157,0.3);
  color: var(--accent2);
  font-size: 0.8rem;
  padding: 5px 12px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-logout:hover {
  background: rgba(255,107,157,0.1);
}

/* ===== VIEWS ===== */
.view {
  display: none;
  min-height: 100vh;
  padding-top: 0;
  position: relative;
  z-index: 1;
  animation: fadeIn 0.4s ease;
}
.view.active { display: block; }
#view-auth.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== AUTH PAGE ===== */
#view-auth {
  padding: 40px 20px;
}

.auth-container {
  width: 100%;
  max-width: 440px;
  position: relative;
}

.auth-header {
  text-align: center;
  margin-bottom: 40px;
}
.auth-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 3rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.auth-subtitle {
  margin-top: 10px;
  color: var(--text-muted);
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.auth-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px;
  box-shadow: var(--shadow-glow);
}

.auth-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-deep);
  border-radius: 50px;
  padding: 4px;
  margin-bottom: 30px;
}
.auth-tab {
  flex: 1;
  padding: 9px;
  border: none;
  background: none;
  border-radius: 50px;
  color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.25s ease;
}
.auth-tab.active {
  background: var(--accent);
  color: white;
  font-weight: 500;
}

.form-group {
  margin-bottom: 18px;
}
.form-label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.form-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  color: var(--text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.95rem;
  transition: all 0.2s;
  outline: none;
}
.form-input:focus {
  border-color: var(--border-glow);
  box-shadow: 0 0 0 3px rgba(163,116,255,0.08);
}
.form-input::placeholder { color: var(--text-muted); }

/* Avatar upload */
.avatar-upload-area {
  display: flex;
  align-items: center;
  gap: 16px;
}
.avatar-preview {
  width: 64px; height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
  background: var(--bg-input);
  flex-shrink: 0;
}
.avatar-upload-btn {
  flex: 1;
  background: var(--bg-input);
  border: 1px dashed var(--border-glow);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--accent);
  font-size: 0.85rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.avatar-upload-btn:hover { background: rgba(163,116,255,0.05); }

.btn-primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent), #7c4dcc);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.05em;
  margin-top: 8px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(163,116,255,0.3);
}
.btn-primary:active { transform: translateY(0); }

.auth-msg {
  text-align: center;
  font-size: 0.85rem;
  margin-top: 16px;
  padding: 10px;
  border-radius: var(--radius-sm);
  display: none;
}
.auth-msg.success { background: rgba(94,231,223,0.1); color: var(--accent3); display: block; }
.auth-msg.error { background: rgba(255,107,157,0.1); color: var(--accent2); display: block; }

/* ===== PERSONAL HOME ===== */
#view-home { padding: 90px 20px 60px; }

.home-container { max-width: 680px; margin: 0 auto; }

.profile-banner {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.profile-banner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
}
.profile-big-avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
  flex-shrink: 0;
}
.profile-info { flex: 1; }
.profile-nickname {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--text-primary);
}
.profile-id {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: 3px;
}
.profile-stats {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}
.stat-item {
  text-align: center;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--accent);
}
.stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.edit-profile-btn {
  position: absolute;
  top: 28px;
  right: 28px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans TC', sans-serif;
}
.edit-profile-btn:hover {
  border-color: var(--border-glow);
  color: var(--text-primary);
}

.new-post-btn {
  width: 100%;
  padding: 16px;
  background: var(--bg-card);
  border: 1px dashed var(--border-glow);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.95rem;
  cursor: pointer;
  text-align: left;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.new-post-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(163,116,255,0.04);
}
.new-post-btn .plus-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(163,116,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--text-secondary);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.my-posts-list { display: flex; flex-direction: column; gap: 12px; }

.my-post-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.my-post-item:hover {
  border-color: var(--border-glow);
  background: var(--bg-hover);
}
.my-post-title {
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--text-primary);
  margin-bottom: 5px;
}
.my-post-preview {
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.my-post-meta {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-muted);
}
.my-post-thumb {
  width: 100%;
  max-height: 120px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: 10px;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

/* ===== NEW POST PAGE ===== */
#view-newpost { padding: 90px 20px 60px; }
.newpost-container { max-width: 680px; margin: 0 auto; }

.newpost-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.back-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.back-btn:hover { border-color: var(--border-glow); color: var(--text-primary); }

.newpost-user-badge {
  display: flex;
  align-items: center;
  gap: 10px;
}
.newpost-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--accent);
}
.newpost-username {
  font-weight: 500;
  font-size: 0.9rem;
}
.newpost-userid { font-size: 0.8rem; color: var(--text-muted); }

.newpost-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow-glow);
}

.form-textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  color: var(--text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.95rem;
  resize: vertical;
  min-height: 140px;
  transition: all 0.2s;
  outline: none;
  line-height: 1.7;
}
.form-textarea:focus {
  border-color: var(--border-glow);
  box-shadow: 0 0 0 3px rgba(163,116,255,0.08);
}
.form-textarea::placeholder { color: var(--text-muted); }

.img-upload-area {
  border: 1px dashed var(--border-glow);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-muted);
  font-size: 0.85rem;
}
.img-upload-area:hover { background: rgba(163,116,255,0.04); border-color: var(--accent); }
.img-upload-icon { font-size: 1.8rem; margin-bottom: 6px; }
.img-preview-wrap { position: relative; margin-top: 12px; }
.img-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 10px;
  display: none;
}
.img-remove-btn {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.7);
  border: none;
  color: white;
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.8rem;
  display: none;
  align-items: center; justify-content: center;
}

.publish-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent2), #cc4d7a);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.06em;
  margin-top: 20px;
}
.publish-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255,107,157,0.3);
}

/* ===== SHARE WALL ===== */
#view-wall { padding: 80px 20px 60px; }
.wall-container { max-width: 680px; margin: 0 auto; }

.wall-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.wall-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.online-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent3);
  box-shadow: 0 0 10px var(--accent3);
  display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.posts-feed { display: flex; flex-direction: column; gap: 20px; }

.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.25s ease;
  animation: slideUp 0.35s ease both;
}
.post-card:hover {
  border-color: var(--border-glow);
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}

.post-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px 0;
}
.post-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border-glow);
  flex-shrink: 0;
}
.post-author { flex: 1; }
.post-author-name {
  font-weight: 500;
  font-size: 0.92rem;
  color: var(--text-primary);
}
.post-author-id {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.post-time {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.post-body { padding: 14px 20px; }
.post-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.post-content {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}
.post-img {
  width: 100%;
  max-height: 360px;
  object-fit: cover;
  margin-top: 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.post-img:hover { opacity: 0.9; }

.clickable-user { cursor: pointer; transition: opacity 0.2s; }
.clickable-user:hover { opacity: 0.8; }

.post-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 50px;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans TC', sans-serif;
}
.action-btn:hover { background: var(--glass); color: var(--text-primary); }
.action-btn.liked { color: var(--accent2); }
.action-btn.liked:hover { color: var(--accent2); }
.action-btn.bookmarked { color: var(--accent3); }
.action-btn.bookmarked:hover { color: var(--accent3); }
.action-btn svg { width: 17px; height: 17px; fill: currentColor; }

/* Comments section */
.comments-section {
  display: none;
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  background: rgba(0,0,0,0.2);
}
.comments-section.open { display: block; }

.comment-item {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  animation: slideUp 0.2s ease;
}
.comment-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border-glow);
  flex-shrink: 0;
}
.comment-bubble {
  flex: 1;
  background: var(--bg-input);
  border-radius: 0 10px 10px 10px;
  padding: 10px 14px;
}
.comment-author {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 3px;
}
.comment-text {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.5;
  word-break: break-word;
}
.comment-time {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.comment-input-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-top: 12px;
}
.comment-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 9px 16px;
  color: var(--text-primary);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.85rem;
  outline: none;
  transition: all 0.2s;
}
.comment-input:focus { border-color: var(--border-glow); }
.comment-input::placeholder { color: var(--text-muted); }

.comment-send-btn {
  background: var(--accent);
  border: none;
  width: 36px; height: 36px;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.comment-send-btn:hover {
  background: #8a5ef0;
  transform: scale(1.05);
}
.comment-send-btn svg { width: 16px; height: 16px; }

.comment-locked {
  text-align: center;
  padding: 12px;
  color: var(--text-muted);
  font-size: 0.82rem;
  cursor: pointer;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  margin-top: 10px;
}
.comment-locked:hover { border-color: var(--accent); color: var(--accent); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }

.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: var(--radius);
  padding: 36px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 80px rgba(0,0,0,0.5), var(--shadow-glow);
  animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}
.modal-icon { font-size: 2.5rem; margin-bottom: 14px; }
.modal-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  margin-bottom: 8px;
}
.modal-desc {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-bottom: 24px;
  line-height: 1.6;
}
.modal-btns {
  display: flex;
  gap: 10px;
}
.modal-btn {
  flex: 1;
  padding: 11px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 0.88rem;
  font-weight: 500;
  transition: all 0.2s;
}
.modal-btn-primary {
  background: var(--accent);
  color: white;
}
.modal-btn-primary:hover { background: #8a5ef0; }
.modal-btn-secondary {
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.modal-btn-secondary:hover { border-color: var(--border-glow); color: var(--text-primary); }

/* CAPTCHA Grid */
.captcha-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.captcha-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.captcha-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.2s;
}
.captcha-item:hover img {
  transform: scale(1.05);
}
.captcha-item.selected {
  border-color: var(--accent3);
}
.captcha-item.selected::after {
  content: '✓';
  position: absolute;
  top: 5px;
  right: 5px;
  background: var(--accent3);
  color: #000;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  z-index: 2;
}
.captcha-item.selected img {
  opacity: 0.7;
}

/* Image Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: zoom-out;
}
.lightbox.show { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 10px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 50px;
  padding: 12px 24px;
  font-size: 0.88rem;
  color: var(--text-primary);
  z-index: 400;
  opacity: 0;
  transition: all 0.3s ease;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.success { border-color: var(--accent3); color: var(--accent3); }
.toast.error { border-color: var(--accent2); color: var(--accent2); }

/* Responsive */
@media (max-width: 600px) {
  .auth-card { padding: 24px; }
  .newpost-card { padding: 22px; }
  .profile-banner { flex-direction: column; text-align: center; }
  .profile-stats { justify-content: center; }
  #navbar { padding: 12px 16px; }
  .nav-nickname { display: none; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }
</style>
</head>

<script>
// ===== DATA LAYER =====
const DB = {
  getUsers: () => JSON.parse(localStorage.getItem('emo_users') || '[]'),
  saveUsers: (u) => localStorage.setItem('emo_users', JSON.stringify(u)),
  getPosts: () => JSON.parse(localStorage.getItem('emo_posts') || '[]'),
  savePosts: (p) => localStorage.setItem('emo_posts', JSON.stringify(p)),
  getCurrentUser: () => JSON.parse(localStorage.getItem('emo_current') || 'null'),
  setCurrentUser: (u) => localStorage.setItem('emo_current', JSON.stringify(u)),
  clearCurrentUser: () => localStorage.removeItem('emo_current'),
};

let currentUser = DB.getCurrentUser();

// ===== INIT =====
function initSeedData() {
  const users = DB.getUsers();
  const hasSeeded = users.some(u => u.id === 'alice' || u.id === 'bob_tech');
  if (hasSeeded) return;

  const virtualUsers = [
    { id: 'alice', nickname: 'Alice', password: '123', avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&q=80' },
    { id: 'bob_tech', nickname: 'Bob 技術宅', password: '123', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&q=80' },
    { id: 'chloe_art', nickname: 'Chloe 🎨', password: '123', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&q=80' }
  ];
  
  const virtualPosts = [
    {
      postId: 'post_seed_1',
      userId: 'alice',
      nickname: 'Alice',
      avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&q=80',
      title: '今天的天氣真好！',
      content: '早安！今天陽光明媚，出門走走心情特別好。希望能一直保持這樣的好天氣☀️',
      image: 'https://images.unsplash.com/photo-1472824613204-7221db028e35?w=600&q=80',
      timestamp: Date.now() - 3600000 * 2,
      likes: ['bob_tech'],
      bookmarks: ['bob_tech'],
      comments: [
        { userId: 'bob_tech', nickname: 'Bob 技術宅', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&q=80', content: '真的！超適合出遊', timestamp: Date.now() - 3000000 }
      ]
    },
    {
      postId: 'post_seed_2',
      userId: 'bob_tech',
      nickname: 'Bob 技術宅',
      avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&q=80',
      title: '新買的機械鍵盤到了',
      content: '等待了兩個月的茶軸鍵盤終於來了！敲擊的手感太棒了，感覺打程式的速度都變快了😎',
      image: 'https://images.unsplash.com/photo-1595225476474-87563907a212?w=600&q=80',
      timestamp: Date.now() - 86400000,
      likes: ['alice', 'chloe_art'],
      bookmarks: [],
      comments: []
    },
    {
      postId: 'post_seed_3',
      userId: 'chloe_art',
      nickname: 'Chloe 🎨',
      avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&q=80',
      title: '週末的靈感創作',
      content: '花了一個下午畫的草稿，試著用了新的配色，大家覺得如何？',
      image: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600&q=80',
      timestamp: Date.now() - 86400000 * 2,
      likes: ['alice'],
      bookmarks: ['alice'],
      comments: [
        { userId: 'alice', nickname: 'Alice', avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&q=80', content: '顏色很美耶，期待完稿！', timestamp: Date.now() - 86000000 * 2 }
      ]
    }
  ];

  users.push(...virtualUsers);
  DB.saveUsers(users);
  
  const posts = DB.getPosts();
  posts.push(...virtualPosts);
  DB.savePosts(posts);
}

window.addEventListener('DOMContentLoaded', () => {
  initSeedData();
  if (currentUser) {
    updateNavbar();
    showView('wall');
  } else {
    showView('auth');
  }
});

// ===== VIEW ROUTER =====
function showView(name) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
    v.style.display = 'none';
  });
  const el = document.getElementById('view-' + name);
  if (el) {
    el.style.display = '';
    el.classList.add('active');
    window.scrollTo(0, 0);
  }
  if (name !== 'auth') {
    document.getElementById('navbar').classList.add('show');
  } else {
    document.getElementById('navbar').classList.remove('show');
  }
  if (name === 'home') renderHome();
  if (name === 'newpost') renderNewPost();
  if (name === 'wall') renderWall();
}

// ===== NAVBAR =====
function updateNavbar() {
  if (!currentUser) return;
  document.getElementById('nav-avatar').src = currentUser.avatar;
  document.getElementById('nav-nickname').textContent = currentUser.nickname;
}

function logout() {
  DB.clearCurrentUser();
  currentUser = null;
  showToast('已登出，掰掰 👋');
  setTimeout(() => showView('auth'), 600);
}

// ===== AUTH =====
function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';

function doRegister() {

  if (!id || !name || !pw) return showMsg('reg-msg', '請填寫所有必填欄位', 'error');

let pendingLoginUser = null;
const captchaData = [
  { id: 1, src: 'https://picsum.photos/id/1015/200/200', isPokemon: false },
  { id: 2, src: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/909.png', isPokemon: true },
  { id: 3, src: 'https://picsum.photos/id/1016/200/200', isPokemon: false },
  { id: 4, src: 'https://picsum.photos/id/1018/200/200', isPokemon: false },
  { id: 5, src: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png', isPokemon: true },
  { id: 6, src: 'https://picsum.photos/id/1019/200/200', isPokemon: false },
  { id: 7, src: 'https://picsum.photos/id/1020/200/200', isPokemon: false },
  { id: 8, src: 'https://picsum.photos/id/1021/200/200', isPokemon: false },
  { id: 9, src: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png', isPokemon: true }
];
let selectedCaptchaIds = [];

function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!id || !pw) return showMsg('login-msg', '請填寫帳號和密碼', 'error');
  const users = DB.getUsers();
  const user = users.find(u => u.id === id && u.password === pw);
  if (!user) return showMsg('login-msg', '帳號或密碼錯誤', 'error');
  
  pendingLoginUser = { id: user.id, nickname: user.nickname, avatar: user.avatar };
  renderCaptcha();
  showModal('modal-2fa');
}

function renderCaptcha() {
  selectedCaptchaIds = [];
  const grid = document.getElementById('captcha-grid');
  grid.innerHTML = '';
  
  const displayItems = [...captchaData].sort(() => Math.random() - 0.5);
  
  displayItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'captcha-item';
    div.onclick = () => {
      div.classList.toggle('selected');
      const idx = selectedCaptchaIds.indexOf(item.id);
      if (idx === -1) selectedCaptchaIds.push(item.id);
      else selectedCaptchaIds.splice(idx, 1);
    };
    div.innerHTML = `<img src="${item.src}" alt="captcha option" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1605901309584-818e25960b8f?w=400&q=80'">`;
    grid.appendChild(div);
  });
}

function verify2FA() {
  if (!pendingLoginUser) return;
  
  const correctIds = captchaData.filter(i => i.isPokemon).map(i => i.id);
  const isCorrect = selectedCaptchaIds.length === correctIds.length && 
                    selectedCaptchaIds.every(id => correctIds.includes(id));
                    
  if (isCorrect) {
    currentUser = pendingLoginUser;
    DB.setCurrentUser(currentUser);
    updateNavbar();
    document.getElementById('login-id').value = '';
    document.getElementById('login-pw').value = '';
    closeModal('modal-2fa');
    showToast('驗證成功！歡迎回來，' + currentUser.nickname + ' 🌙', 'success');
    pendingLoginUser = null;
    setTimeout(() => showView('wall'), 500);
  } else {
    showToast('驗證失敗，請選取正確的寶可夢圖片', 'error');
    renderCaptcha();
  }
}

let editAvatarBase64 = '';

function showEditProfileModal() {
  if (!currentUser) return;
  document.getElementById('edit-nickname').value = currentUser.nickname;
  document.getElementById('edit-avatar-preview').src = currentUser.avatar;
  editAvatarBase64 = currentUser.avatar;
  showModal('modal-edit-profile');
}

function previewEditAvatar(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    editAvatarBase64 = e.target.result;
    document.getElementById('edit-avatar-preview').src = editAvatarBase64;
  };
  reader.readAsDataURL(input.files[0]);
}

function saveProfile() {
  const newName = document.getElementById('edit-nickname').value.trim();
  if (!newName) return showToast('暱稱不能為空', 'error');
  
  const users = DB.getUsers();
  const userIndex = users.findIndex(u => u.id === currentUser.id);
  if (userIndex !== -1) {
    users[userIndex].nickname = newName;
    users[userIndex].avatar = editAvatarBase64;
    DB.saveUsers(users);
  }
  
  let posts = DB.getPosts();
  posts.forEach(p => {
    if (p.userId === currentUser.id) {
      p.nickname = newName;
      p.avatar = editAvatarBase64;
    }
    p.comments.forEach(c => {
      if (c.userId === currentUser.id) {
        c.nickname = newName;
        c.avatar = editAvatarBase64;
      }
    });
  });
  DB.savePosts(posts);

  currentUser.nickname = newName;
  currentUser.avatar = editAvatarBase64;
  DB.setCurrentUser(currentUser);
  
  updateNavbar();
  renderHome();
  closeModal('modal-edit-profile');
  showToast('個人資料已更新 ✨', 'success');
}

  document.getElementById('newpost-avatar').src = currentUser.avatar;

  document.getElementById('newpost-id').textContent = '@' + currentUser.id;

let postImgBase64 = '';

function previewPostImg(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    postImgBase64 = e.target.result;
    const preview = document.getElementById('post-img-preview');
    preview.src = postImgBase64;
    preview.style.display = 'block';
    const btn = document.getElementById('img-remove-btn');
    btn.style.display = 'flex';

function removePostImg() {
  postImgBase64 = '';
  document.getElementById('post-img-preview').style.display = 'none';
  document.getElementById('post-img-preview').src = '';
  document.getElementById('img-remove-btn').style.display = 'none';
  document.getElementById('post-img-file').value = '';
}

function publishPost() {
  const title = document.getElementById('post-title').value.trim();
  const content = document.getElementById('post-content').value.trim();
  if (!title) return showToast('請填寫發布主題', 'error');
  if (!content) return showToast('請填寫發布內容', 'error');
  const posts = DB.getPosts();
  const newPost = {
    postId: 'post_' + Date.now(),
    userId: currentUser.id,
    nickname: currentUser.nickname,
    avatar: currentUser.avatar,
    title,
    content,
    image: postImgBase64,
    timestamp: Date.now(),
    likes: [],
    bookmarks: [],
    comments: []
  };
  posts.unshift(newPost);
  DB.savePosts(posts);
  showToast('🚀 貼文已發布！', 'success');
  removePostImg();
  setTimeout(() => showView('wall'), 500);
}

function deletePost(postId, event) {
  if (event) event.stopPropagation();
  if (!confirm('確定要刪除這篇貼文嗎？')) return;
  
  let posts = DB.getPosts();
  posts = posts.filter(p => p.postId !== postId);
  DB.savePosts(posts);
  
  showToast('貼文已刪除 🗑️', 'success');
  
  // Re-render views
  if (document.getElementById('view-home').classList.contains('active')) {
    renderHome();
  } else if (document.getElementById('view-wall').classList.contains('active')) {
    renderWall();
  }
}

// ===== WALL =====
function renderWall() {
  const posts = DB.getPosts().sort((a,b) => b.timestamp - a.timestamp);
  const feed = document.getElementById('posts-feed');
  const empty = document.getElementById('wall-empty');
  feed.innerHTML = '';

  if (posts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  posts.forEach((post, idx) => {
    const card = buildPostCard(post, idx);
    feed.appendChild(card);
  });
}

function showUserProfile(userId) {
  const users = DB.getUsers();
  const user = users.find(u => u.id === userId);
  if (!user) {
    showToast('找不到該使用者', 'error');
    return;
  }

  // Update banner info
  document.getElementById('profile-avatar').src = user.avatar;
  document.getElementById('profile-nickname').textContent = user.nickname;
  document.getElementById('profile-id').textContent = '@' + user.id;

  // Render user posts
  const posts = DB.getPosts().filter(p => p.userId === userId).sort((a,b) => b.timestamp - a.timestamp);
  document.getElementById('profile-post-count').textContent = posts.length;

  const list = document.getElementById('profile-posts-list');
  list.innerHTML = '';
  if (posts.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🌙</div><div>這位使用者還沒有分享過任何貼文</div></div>`;
  } else {
    posts.forEach(p => {
      // Re-use my-post-item styles, but without the delete button

        <div class="my-post-title">${escHtml(p.title)}</div>
        <div class="my-post-preview">${escHtml(p.content)}</div>
        ${p.image ? `<img class="my-post-thumb" src="${p.image}" alt="">` : ''}
        <div class="my-post-meta">${formatTime(p.timestamp)} · ${(p.likes||[]).length} 個讚 · ${(p.comments||[]).length} 則留言</div>
      `;
      list.appendChild(div);
    });
  }

  showView('profile');
}

function buildPostCard(post, idx) {
  const card = document.createElement('div');
  card.className = 'post-card';
  card.style.animationDelay = (idx * 0.06) + 's';
  card.dataset.postId = post.postId;

  const isLiked = currentUser && (post.likes || []).includes(currentUser.id);
  const isBookmarked = currentUser && (post.bookmarks || []).includes(currentUser.id);

  card.innerHTML = `
    <div class="post-header">
      <img class="post-avatar clickable-user" src="${post.avatar}" alt="" onclick="showUserProfile('${post.userId}')">
      <div class="post-author">
        <div class="post-author-name clickable-user" onclick="showUserProfile('${post.userId}')">${escHtml(post.nickname)}</div>
        <div class="post-author-id">@${escHtml(post.userId)}</div>
      </div>
      <div class="post-time">${formatTime(post.timestamp)}</div>
      ${currentUser && currentUser.id === post.userId ? `<button class="action-btn" onclick="deletePost('${post.postId}', event)" style="color: var(--accent2); padding: 4px; margin-left: 8px;" title="刪除貼文"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>` : ''}
    </div>
    <div class="post-body">
      <div class="post-title">${escHtml(post.title)}</div>
      <div class="post-content">${escHtml(post.content)}</div>
      ${post.image ? `<img class="post-img" src="${post.image}" alt="" onclick="openLightbox('${post.image}')">` : ''}
    </div>
    <div class="post-actions">
      <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.postId}', this)">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span id="like-count-${post.postId}">${(post.likes||[]).length}</span>
      </button>
      <button class="action-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${post.postId}', this)">
        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <span id="bookmark-count-${post.postId}">${(post.bookmarks || []).length}</span>
      </button>
      <button class="action-btn" onclick="toggleComments('${post.postId}')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="comment-count-${post.postId}">${post.comments.length}</span>
      </button>
    </div>
    <div class="comments-section" id="comments-${post.postId}">
      <div id="comment-list-${post.postId}"></div>
      ${currentUser
        ? `<div class="comment-input-row">
            <img style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border-glow);flex-shrink:0" src="${currentUser.avatar}" alt="">
            <input class="comment-input" id="comment-input-${post.postId}" placeholder="說些什麼..." onkeydown="if(event.key==='Enter')sendComment('${post.postId}')">
            <button class="comment-send-btn" onclick="sendComment('${post.postId}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>`
        : `<div class="comment-locked" onclick="showModal('modal-login')">🔒 登入後才能留言</div>`
      }
    </div>
  `;

  renderCommentList(post.postId, post.comments, card);
  return card;
}

function renderCommentList(postId, comments, cardEl) {
  const el = (cardEl || document).querySelector(`#comment-list-${postId}`);
  if (!el) return;
  el.innerHTML = '';
  if (comments.length === 0) {
    el.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:8px 0;margin-bottom:8px;">還沒有留言，來打破寂靜吧 🌙</div>`;
    return;
  }
  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <img class="comment-avatar clickable-user" src="${c.avatar}" alt="" onclick="showUserProfile('${c.userId}')">
      <div class="comment-bubble">
        <div class="comment-author clickable-user" style="display: inline-block;" onclick="showUserProfile('${c.userId}')">${escHtml(c.nickname)}</div>
        <div class="comment-text">${escHtml(c.content)}</div>
        <div class="comment-time">${formatTime(c.timestamp)}</div>
      </div>
    `;
    el.appendChild(div);
  });
}

function toggleComments(postId) {
  const sec = document.getElementById('comments-' + postId);
  if (!sec) return;
  sec.classList.toggle('open');
}

function toggleLike(postId, btn) {
  if (!currentUser) { showModal('modal-login'); return; }
  const posts = DB.getPosts();
  const post = posts.find(p => p.postId === postId);
  if (!post) return;
  const idx = post.likes.indexOf(currentUser.id);
  if (idx === -1) { post.likes.push(currentUser.id); }
  else { post.likes.splice(idx, 1); }
  DB.savePosts(posts);
  btn.classList.toggle('liked', post.likes.includes(currentUser.id));
  document.getElementById('like-count-' + postId).textContent = post.likes.length;
}

function toggleBookmark(postId, btn) {
  if (!currentUser) { showModal('modal-login'); return; }
  const posts = DB.getPosts();
  const post = posts.find(p => p.postId === postId);
  if (!post) return;
  if (!post.bookmarks) post.bookmarks = [];
  const idx = post.bookmarks.indexOf(currentUser.id);
  if (idx === -1) { post.bookmarks.push(currentUser.id); }
  else { post.bookmarks.splice(idx, 1); }
  DB.savePosts(posts);
  btn.classList.toggle('bookmarked', post.bookmarks.includes(currentUser.id));
  document.getElementById('bookmark-count-' + postId).textContent = post.bookmarks.length;
}

function sendComment(postId) {
  if (!currentUser) { showModal('modal-login'); return; }
  const input = document.getElementById('comment-input-' + postId);
  const text = input.value.trim();
  if (!text) return;
  const posts = DB.getPosts();
  const post = posts.find(p => p.postId === postId);
  if (!post) return;
  const comment = {
    userId: currentUser.id,
    nickname: currentUser.nickname,
    avatar: currentUser.avatar,
    content: text,
    timestamp: Date.now()
  };
  post.comments.push(comment);
  DB.savePosts(posts);
  input.value = '';
  document.getElementById('comment-count-' + postId).textContent = post.comments.length;
  renderCommentList(postId, post.comments);
}

  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');

function goToLogin() {
  closeModal('modal-login');
  showView('auth');
  switchAuthTab('login');
}

// ===== LIGHTBOX =====
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// ===== TOAST =====
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

// ===== HELPERS =====
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '剛剛';
  if (diff < 3600000) return Math.floor(diff/60000) + ' 分鐘前';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' 小時前';
  if (diff < 604800000) return Math.floor(diff/86400000) + ' 天前';
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
